<!DOCTYPE html>
<html lang="en">
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Coiny&display=swap"
        rel="stylesheet"
      />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Coiny&family=Sono:wght@200..800&display=swap"
        rel="stylesheet"
      />

      <link href="style.css" rel="stylesheet" />
      <title>Code&Lock</title>
    </head>
    <body>
      <!-- Логотип + назва -->
      <header class="header">
        <img src="logo.png" alt="Логотип Code&Lock" class="logo" />
        <div class="site-name">
          <span>Code&Lock</span>
        </div>

        <nav aria-label="Основна навігація" class="nav">
          <a href="#">ГОЛОВНА</a>
          <a href="#">КОНСУЛЬТАЦІЯ</a>
          <a class="btn-buy" href="#">КУПИТИ</a>
        </nav>
      </header>

      <main>
        <section class="wrap">
          <div class="hero-left">
            <h1>
              Smart Lock — Сучасний метод доступу до готельних номерів без
              перешкод.
            </h1>

            <p class="lead">
              Загубили ключкарту, ключі? Тепер це не проблема, адже з нашим
              замком ви зможете відчиняти двері за допомогою телефону.
            </p>

            <div >
              <a href="#" class="order-btn">Замовити</a>
            </div>
          </div>

          <div class="hero-right">
            <div class="image-card" role="img" aria-label="Укриття">
              <!-- Постав сюди своє фото: /images/hero.jpg -->
              <img src="images/hero.jpg" alt="Модель переносного укриття" />
            </div>
          </div>
        </section>

        </div>
      </main>
    </body>
  </html>
</html>
